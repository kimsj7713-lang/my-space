  <symbol id="i-clipboard" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 3h6v4H9zM9 12h6M9 16h6"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 15a8 8 0 0 1-11-11 8 8 0 1 0 11 11z"/></symbol>
</svg>
<div id="app"></div><div id="modalRoot"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  'use strict';
  const KEY='my-space-prototype-v1', DOW=['월','화','수','목','금','토','일'], GROUPS=['휴식','가슴','등','어깨','하체','팔','유산소','전신','기타'];
  const today=()=>localISO(new Date());
  function localISO(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
  function dateObj(iso){return new Date(`${iso}T12:00:00`);}
  function shiftDate(iso,days){const d=dateObj(iso);d.setDate(d.getDate()+days);return localISO(d);}
  function monday(iso){const d=dateObj(iso);return shiftDate(iso,-((d.getDay()+6)%7));}
  function dayIdx(iso){return (dateObj(iso).getDay()+6)%7;}
  function niceDate(iso){return dateObj(iso).toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});}
  function niceMonth(iso){return dateObj(iso).toLocaleDateString('ko-KR',{year:'numeric',month:'long'});}
  function esc(x){return String(x??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
  function icon(name,size=''){return `<svg class="icon ${size}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;}
  function id(){return (typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2,9);}
  function formatNum(n){return Number(n||0).toLocaleString('ko-KR');}
  const cap=(n,min,max)=>Math.max(min,Math.min(max,n));
  const initialRoutine=()=>['가슴','등','휴식','어깨','하체','휴식','휴식'].map((group,day)=>({day,group,exercises:({가슴:'벤치프레스, 인클라인 프레스, 플라이',등:'랫풀다운, 바벨 로우, 시티드 로우',어깨:'숄더프레스, 사이드 레터럴 레이즈',하체:'스쿼트, 레그프레스, 레그컬'})[group]||''}));
  const emptyState=()=>({version:1,sample:false,theme:'light',events:[],workouts:[],studies:[],goals:[],routine:initialRoutine()});
  function demoState(){const t=today(),w=monday(t);const s=emptyState();s.sample=true;s.events=[{id:id(),title:'전기 자격증 CBT 20문제',date:t,time:'20:00',category:'공부',repeat:'none',notes:'예시 일정입니다. 수정하거나 삭제할 수 있어요.',doneDates:[]},{id:id(),title:'이번 주 학습 계획 확인',date:t,time:'',category:'개인',repeat:'weekly',notes:'매주 같은 요일 반복',doneDates:[]},{id:id(),title:'학교 과제 점검',date:shiftDate(t,2),time:'19:00',category:'공부',repeat:'none',notes:'',doneDates:[]}];s.workouts=[{id:id(),date:w,group:'가슴',minutes:55,exercises:'벤치프레스 3세트 · 인클라인 프레스 3세트',notes:'예시 운동 기록'}];s.studies=[{id:id(),date:w,subject:'전기산업기사 CBT',minutes:75,notes:'예시 공부 기록'}];s.goals=[{id:id(),title:'주 4회 운동',metric:'workouts',target:4,current:0,unit:'회',due:''},{id:id(),title:'일주일 공부 10시간',metric:'study',target:600,current:0,unit:'분',due:''},{id:id(),title:'올해의 개인 목표',metric:'manual',target:100,current:25,unit:'%',due:''}];return s;}
  function normalize(raw){if(!raw||typeof raw!=='object'||Array.isArray(raw))throw new Error('형식이 올바르지 않습니다.');const z=emptyState();for(const k of ['events','workouts','studies','goals']){if(!Array.isArray(raw[k]))throw new Error('데이터 항목이 누락되었습니다: '+k);z[k]=raw[k].filter(x=>x&&typeof x==='object').map(x=>({...x,id:String(x.id||id())}));}z.events=z.events.map(e=>({...e,doneDates:Array.isArray(e.doneDates)?e.doneDates:[],repeat:e.repeat==='weekly'?'weekly':'none'}));if(Array.isArray(raw.routine)){z.routine=initialRoutine().map((r,i)=>{const saved=raw.routine.find(x=>Number(x.day)===i);return saved?{day:i,group:String(saved.group||'휴식'),exercises:String(saved.exercises||'')}:r;});}z.sample=Boolean(raw.sample);z.theme=raw.theme==='dark'?'dark':'light';return z;}
  function load(){try{const x=localStorage.getItem(KEY);return x?normalize(JSON.parse(x)):demoState();}catch(e){console.warn('저장 데이터 로딩 오류:',e);return demoState();}}
  let data=load(),view='dashboard',selectedDate=today(),calMonth=today().slice(0,7)+'-01',toastTimer=null;
  function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true;}catch(e){toast('브라우저 저장이 차단됐어요. 백업 파일을 내려받아 주세요.');return false;}}
  function toast(msg){const x=document.getElementById('toast');x.textContent=msg;x.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.classList.remove('visible'),3000);}
  function eventOccurs(e,d){if(e.repeat==='weekly')return d>=e.date && dayIdx(d)===dayIdx(e.date);return e.date===d;}
  function eventsOn(d){return data.events.filter(e=>eventOccurs(e,d)).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));}
  function isDone(e,d){return (e.doneDates||[]).includes(d);}
  function workoutsOn(d){return data.workouts.filter(x=>x.date===d);}
  function studiesOn(d){return data.studies.filter(x=>x.date===d);}
  function weekDates(base=today()){const start=monday(base);return Array.from({length:7},(_,i)=>shiftDate(start,i));}
  function weekLog(type,base=today()){const w=weekDates(base);return data[type].filter(x=>x.date>=w[0]&&x.date<=w[6]);}
  function totalStudy(base=today()){return weekLog('studies',base).reduce((n,x)=>n+Number(x.minutes||0),0);}
  function weeklyDoneEvents(base=today()){const w=weekDates(base);let n=0;for(const d of w)n+=eventsOn(d).filter(e=>isDone(e,d)).length;return n;}
  function getGoalValue(g){switch(g.metric){case 'workouts':return weekLog('workouts').length;case 'study':return totalStudy();case 'tasks':return weeklyDoneEvents();default:return Number(g.current||0);}}
  function goalPct(g){return cap(Math.round(getGoalValue(g)/Math.max(1,Number(g.target))*100),0,100);}
  function goalText(g){const value=getGoalValue(g),unit=g.unit||(g.metric==='study'?'분':g.metric==='manual'?'':'회');return `${formatNum(value)} / ${formatNum(g.target)}${unit}`;}
  function categoryPill(cat){return {일정:'blue',개인:'purple',운동:'green',공부:'orange'}[cat]||'blue';}
  const nav=[['dashboard','home','대시보드'],['calendar','calendar','일정 관리'],['workout','dumbbell','운동 관리'],['study','book','공부 관리'],['goals','target','목표 관리']];
  function render(){document.documentElement.dataset.theme=data.theme;const title={dashboard:'대시보드',calendar:'일정 관리',workout:'운동 관리',study:'공부 관리',goals:'목표 관리',settings:'설정 및 백업'}[view];const dateLabel=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});document.getElementById('app').innerHTML=`<div class="layout"><aside class="sidebar"><div class="logo"><div class="logo-mark">M</div><div><div class="logo-title">MY SPACE</div><div class="logo-sub">PERSONAL DASHBOARD</div></div></div><div class="nav-label">WORKSPACE</div><nav class="nav" aria-label="주 메뉴">${nav.map(([k,i,n])=>`<button data-action="navigate" data-view="${k}" class="${view===k?'active':''}">${icon(i)} ${n}</button>`).join('')}</nav><div class="nav-label" style="margin-top:29px">ACCOUNT</div><nav class="nav"><button data-action="navigate" data-view="settings" class="${view==='settings'?'active':''}">${icon('settings')} 설정 및 백업</button></nav><div class="sidebar-bottom"><div class="side-chip"><span class="dot"></span> 이 브라우저에 자동 저장</div><div class="tiny" style="color:#7586a4">MY SPACE v0.1 · 로컬 프로토타입</div></div></aside><main class="main"><header class="topbar"><div><div class="breadcrumbs">MY SPACE / ${title}</div><div class="top-title">${title}</div></div><div class="top-right"><span class="top-date">${dateLabel}</span><button class="btn square" aria-label="다크 모드 전환" data-action="theme">${icon(data.theme==='dark'?'sun':'moon')}</button><div class="avatar">MY</div></div></header><div class="page">${data.sample?`<div class="sample-banner"><span>${icon('info','sm')} <b>체험용 예시 데이터</b>가 들어 있어요. 내 기록으로 쓰려면 예시를 지우고 시작하세요.</span><button data-action="clear-demo">예시 지우기</button></div>`:''}${({dashboard:renderDashboard,calendar:renderCalendar,workout:renderWorkout,study:renderStudy,goals:renderGoals,settings:renderSettings})[view]()}</div></main><nav class="mobile-nav" aria-label="모바일 메뉴">${nav.map(([k,i,n])=>`<button data-action="navigate" data-view="${k}" class="${view===k?'active':''}">${icon(i)}<span>${n.replace(' 관리','')}</span></button>`).join('')}</nav></div>`;}
  function renderDashboard(){const t=today(),ev=eventsOn(t),done=ev.filter(e=>isDone(e,t)).length,wcount=weekLog('workouts').length,study=totalStudy(),targetW=data.goals.find(g=>g.metric==='workouts')?.target||4,targetS=data.goals.find(g=>g.metric==='study')?.target||600;const days=weekDates();return `<section class="hero"><div class="hero-content"><div class="hero-eyebrow">${niceDate(t)} · YOUR DAILY SPACE</div><h1>오늘의 계획을 한눈에,<br>기록은 가볍게 시작해요.</h1><p>일정 · 운동 · 공부 · 목표를 한 곳에서 관리하세요.</p><div class="row wrap"><button class="btn" data-action="add-event">${icon('plus','sm')} 일정 추가</button><button class="btn" data-action="add-study">${icon('book','sm')} 공부 기록</button></div></div><div class="hero-graphic">${icon('spark')}</div></section>
    <div class="stat-grid"><div class="panel stat"><div class="stat-icon blue">${icon('calendar')}</div><div class="stat-label">오늘의 일정</div><div class="stat-value">${done} <span class="muted" style="font-size:15px">/ ${ev.length}</span></div><div class="stat-foot">오늘 완료한 일정</div></div><div class="panel stat"><div class="stat-icon green">${icon('dumbbell')}</div><div class="stat-label">이번 주 운동</div><div class="stat-value">${wcount} <span class="muted" style="font-size:15px">/ ${formatNum(targetW)}회</span></div><div class="stat-foot">운동 기록으로 자동 집계</div></div><div class="panel stat"><div class="stat-icon orange">${icon('book')}</div><div class="stat-label">이번 주 공부</div><div class="stat-value">${Math.floor(study/60)}<span class="muted" style="font-size:15px">시간 ${study%60}분</span></div><div class="stat-foot">목표 ${formatNum(targetS)}분</div></div><div class="panel stat"><div class="stat-icon purple">${icon('target')}</div><div class="stat-label">활성 목표</div><div class="stat-value">${data.goals.length}<span class="muted" style="font-size:15px">개</span></div><div class="stat-foot">달성 완료 ${data.goals.filter(g=>goalPct(g)===100).length}개</div></div></div>
    <div class="overview-grid" style="margin-top:18px"><section class="panel"><div class="spread" style="margin-bottom:14px"><div><div class="strong" style="font-size:16px">오늘 할 일</div><div class="muted small">중요한 하루 일정부터 완료해 보세요</div></div><button class="btn soft small-btn" data-action="add-event">${icon('plus','sm')} 추가</button></div>${ev.length?`<div class="task-list">${ev.map(e=>taskItem(e,t)).join('')}</div>`:empty('clipboard','오늘 등록된 일정이 없어요','일정을 등록하면 여기 표시돼요.')}</section><section class="panel"><div class="spread" style="margin-bottom:16px"><div><div class="strong" style="font-size:16px">나의 목표</div><div class="muted small">기록과 연결된 목표는 자동 집계돼요</div></div><button class="link-btn" data-action="navigate" data-view="goals">전체 보기 →</button></div>${data.goals.length?data.goals.slice(0,4).map(renderGoalLine).join(''):empty('target','등록된 목표가 없어요','운동·공부 자동 목표를 추가해 보세요.')}</section></div>
    <div class="overview-grid" style="margin-top:18px"><section class="panel"><div class="spread" style="margin-bottom:16px"><div class="strong" style="font-size:16px">이번 주 캘린더</div><button class="link-btn" data-action="navigate" data-view="calendar">달력 보기 →</button></div><div class="week-strip">${days.map(d=>{const dots=[eventsOn(d).length?'event':'',workoutsOn(d).length?'workout':'',studiesOn(d).length?'study':''].filter(Boolean);return `<button data-action="select-date" data-date="${d}" class="day-chip ${d===t?'today':''}"><span class="d">${DOW[dayIdx(d)]}</span><span class="n">${Number(d.slice(-2))}</span><span class="dots">${dots.length?dots.map(x=>`<span class="small-dot ${x}-dot"></span>`).join(''):'<span style="width:6px"></span>'}</span></button>`;}).join('')}</div><div class="muted tiny" style="margin-top:14px">파랑: 일정 &nbsp; 초록: 운동 &nbsp; 주황: 공부</div></section><section class="panel"><div class="spread" style="margin-bottom:12px"><div class="strong" style="font-size:16px">다가오는 일정</div><button class="link-btn" data-action="add-event">+ 추가</button></div>${renderUpcoming()}</section></div>`;}
  function renderGoalLine(g){return `<div class="goal-item"><div class="spread"><span class="goal-name">${esc(g.title)}</span><span class="goal-value">${esc(goalText(g))}</span></div><div class="progress ${g.metric==='workouts'?'green':g.metric==='study'?'orange':''}"><span style="width:${goalPct(g)}%"></span></div></div>`;}
  function empty(i,title,sub){return `<div class="empty">${icon(i,'lg')}<b>${title}</b><span class="small">${sub}</span></div>`;}
  function taskItem(e,d,editable=false){return `<div class="task ${isDone(e,d)?'done':''}"><button class="check ${isDone(e,d)?'done':''}" data-action="toggle-event" data-id="${esc(e.id)}" data-date="${d}" aria-label="${isDone(e,d)?'완료 취소':'완료 처리'}">${isDone(e,d)?icon('check','sm'):''}</button><div class="task-body"><div class="task-text">${esc(e.title)}</div><div class="task-meta"><span class="pill ${categoryPill(e.category)}" style="padding:2px 7px;font-size:10px">${esc(e.category||'일정')}</span> ${e.repeat==='weekly'?'매주 반복':''}</div></div><div class="task-time">${e.time?esc(e.time):'종일'}</div>${editable?`<div class="inline-actions"><button class="btn icon-btn small-btn" aria-label="수정" data-action="edit-event" data-id="${esc(e.id)}">${icon('edit','sm')}</button><button class="btn icon-btn small-btn danger" aria-label="삭제" data-action="delete-event" data-id="${esc(e.id)}">${icon('trash','sm')}</button></div>`:''}</div>`;}
  function renderUpcoming(){const upcoming=[];for(let i=1;i<=14;i++){const d=shiftDate(today(),i);for(const e of eventsOn(d))upcoming.push({e,d});if(upcoming.length>=4)break;}return upcoming.length?`<div class="task-list">${upcoming.slice(0,4).map(({e,d})=>`<div class="task"><div style="width:42px;text-align:center;background:var(--surface2);padding:6px 2px;border-radius:9px"><div class="tiny muted">${DOW[dayIdx(d)]}</div><b>${Number(d.slice(-2))}</b></div><div class="task-body"><div class="task-text">${esc(e.title)}</div><div class="task-meta">${niceDate(d)} ${esc(e.time||'')}</div></div></div>`).join('')}</div>`:empty('calendar','예정된 일정이 없어요','새 일정을 추가해 보세요.');}
  function renderCalendar(){const first=dateObj(calMonth),y=first.getFullYear(),m=first.getMonth(),offset=(first.getDay()+6)%7,start=new Date(y,m,1-offset),cells=Array.from({length:42},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return localISO(d)}),ev=eventsOn(selectedDate),w= data.routine[dayIdx(selectedDate)]||{group:'휴식'},work=workoutsOn(selectedDate),study=studiesOn(selectedDate);return `<div class="spread wrap"><div><h1 class="page-title">나의 캘린더</h1><p class="page-sub">개인 일정과 공부 계획을 확인하고 완료 여부를 관리하세요.</p></div><button class="btn primary" data-action="add-event">${icon('plus','sm')} 일정 등록</button></div><div class="calendar-layout"><section class="panel"><div class="calendar-toolbar"><div class="month-title">${niceMonth(calMonth)}</div><div class="row"><button class="btn small-btn" data-action="calendar-today">오늘</button><button class="btn icon-btn" aria-label="이전 달" data-action="month-prev">${icon('prev','sm')}</button><button class="btn icon-btn" aria-label="다음 달" data-action="month-next">${icon('next','sm')}</button></div></div><div class="calendar-days">${DOW.map(d=>`<div class="weekday">${d}</div>`).join('')}${cells.map(d=>{const es=eventsOn(d),wk=workoutsOn(d),st=studiesOn(d);const marks=[...es.map(e=>`<div class="cal-event ${isDone(e,d)?'done':''}">${esc(e.title)}</div>`),...(wk.length?['<div class="cal-event workout">● 운동 완료</div>']:[]),...(st.length?['<div class="cal-event study">● 공부 기록</div>']:[])];return `<button class="day-cell ${d.slice(0,7)===calMonth.slice(0,7)?'':'other'} ${d===selectedDate?'selected':''} ${d===today()?'today':''}" data-action="select-date" data-date="${d}"><span class="date-num">${Number(d.slice(-2))}</span>${marks.slice(0,2).join('')}${marks.length>2?`<span class="cal-event more">+${marks.length-2}</span>`:''}</button>`;}).join('')}</div></section><aside class="panel"><div class="spread"><div><div class="muted small">선택한 날짜</div><h2 class="detail-title">${niceDate(selectedDate)}</h2></div><button class="btn soft small-btn" data-action="add-event">${icon('plus','sm')} 일정</button></div><div class="mini-label">일정 ${ev.length}개</div>${ev.length?ev.map(e=>taskItem(e,selectedDate,true)).join(''):empty('calendar','일정이 없어요','오른쪽 위에서 추가해 보세요.')}<div class="mini-label">운동 · 공부 현황</div><div class="info-strip">${icon('dumbbell')} ${esc(w.group==='휴식'?'오늘은 휴식 예정':`${w.group} 루틴 예정`)} · 기록 ${work.length}개</div><div class="info-strip" style="margin-top:8px">${icon('book')} 공부 ${formatNum(study.reduce((s,x)=>s+Number(x.minutes||0),0))}분 기록</div><div class="row wrap" style="margin-top:14px"><button class="btn small-btn" data-action="add-workout">${icon('plus','sm')} 운동 기록</button><button class="btn small-btn" data-action="add-study">${icon('plus','sm')} 공부 기록</button></div><div class="hint-box" style="margin-top:19px">반복 일정은 등록한 요일부터 매주 표시됩니다. 완료 체크는 날짜마다 따로 저장돼요.</div></aside></div>`;}

  if(kind==='workout'){title=edit?'운동 기록 수정':'운동 완료 기록';sub='저장하면 운동 횟수와 목표 달성률이 자동 반영됩니다.';const r=data.routine[dayIdx(view==='calendar'?selectedDate:today())];fields=`<div class="field-row">${field('운동 날짜 *','date','date',rec?.date||(view==='calendar'?selectedDate:today()),true)}${select('운동 부위','group',GROUPS.filter(x=>x!=='휴식'),rec?.group||(r?.group==='휴식'?'가슴':r?.group||'가슴'))}</div>${field('운동 시간 (분) *','minutes','number',rec?.minutes||50,true,'min="1" max="1200"')}${textarea('운동 종목 및 세트','exercises',rec?.exercises||r?.exercises||'')}${textarea('운동 메모','notes',rec?.notes||'')}`;}
  if(kind==='study'){title=edit?'공부 기록 수정':'공부 시간 기록';sub='기록한 시간은 주간 공부 통계와 목표에 연결돼요.';fields=`<div class="field-row">${field('공부 날짜 *','date','date',rec?.date||(view==='calendar'?selectedDate:today()),true)}${field('공부 시간 (분) *','minutes','number',rec?.minutes||60,true,'min="1" max="1440"')}</div>${field('과목 / 공부 주제 *','subject','text',rec?.subject||'',true,'list="subjectSamples" maxlength="100"')}<datalist id="subjectSamples"><option value="전기설비공학"><option value="공업수학"><option value="전자회로"><option value="전기산업기사 CBT"><option value="전기기사 CBT"></datalist>${textarea('공부 내용 / 메모','notes',rec?.notes||'')}`;}
  if(kind==='goal'){title=edit?'목표 수정':'새 목표 추가';sub='운동·공부·일정과 연동하거나 직접 진행률을 입력하세요.';fields=`${field('목표 이름 *','title','text',rec?.title||'',true,'maxlength="100"')}${select('진행률 계산 방법','metric',['manual','workouts','study','tasks'],rec?.metric||'manual').replace('>manual<','>직접 입력<').replace('>workouts<','>이번 주 운동 횟수<').replace('>study<','>이번 주 공부 시간 (분)<').replace('>tasks<','>이번 주 일정 완료 개수<')}<div class="field-row">${field('목표 수치 *','target','number',rec?.target??100,true,'min="1" max="10000000" step="any"')}${field('단위','unit','text',rec?.unit||'%',false,'maxlength="15"')}</div><div class="field-row" id="manualFields">${field('현재 달성 수치','current','number',rec?.current??0,false,'min="0" max="10000000" step="any"')}${field('목표 날짜 (선택)','due','date',rec?.due||'')}</div><div class="form-help">자동 집계는 매주 월~일 기록 기준이며, 목표 수치가 자동으로 반영됩니다.</div>`;}
  if(kind==='routine'){const r=data.routine[extra.day];title=`${DOW[extra.day]}요일 루틴 수정`;sub='요일별 운동 부위와 종목을 자유롭게 수정하세요.';fields=`${select('운동 부위','group',GROUPS,r.group)}${textarea('예정 운동 종목','exercises',r.exercises)}`;}
  modalRoot.innerHTML=`<div class="modal-backdrop" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><h2 id="modalTitle">${title}</h2><p>${sub}</p></div><button type="button" class="btn icon-btn" data-action="close-modal" aria-label="닫기">${icon('close','sm')}</button></div><form id="entityForm" data-kind="${kind}" data-id="${esc(rec?.id||'')}" data-day="${extra.day??''}"><div class="modal-fields">${fields}</div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">취소</button><button type="submit" class="btn primary">${icon('check','sm')} ${edit?'수정 저장':'저장하기'}</button></div></form></div></div>`;if(kind==='goal'){const el=modalRoot.querySelector('[name=metric]');el.addEventListener('change',()=>syncGoalForm());syncGoalForm();}modalRoot.querySelector('input,select,textarea')?.focus();}
  function syncGoalForm(){const m=document.querySelector('#entityForm [name=metric]')?.value,x=document.getElementById('manualFields');if(x){x.querySelector('[name=current]').disabled=m!=='manual';x.style.opacity=m==='manual'?'1':'.65';}const unit=document.querySelector('#entityForm [name=unit]');if(unit&&m!=='manual'){const map={workouts:'회',study:'분',tasks:'개'};unit.value=map[m]||unit.value;}}
  function closeModal(){document.getElementById('modalRoot').innerHTML='';}
  function newRecord(form){const kind=form.dataset.kind,idx=form.dataset.id,fd=new FormData(form),v=k=>String(fd.get(k)||'').trim();let arr=({event:'events',workout:'workouts',study:'studies',goal:'goals'})[kind];if(kind==='routine'){const r=data.routine[Number(form.dataset.day)];r.group=v('group');r.exercises=v('exercises');}else{const a=data[arr],prev=idx?a.find(x=>x.id===idx):null;let obj={id:idx||id()};if(kind==='event'){Object.assign(obj,{title:v('title'),date:v('date'),time:v('time'),category:v('category'),repeat:v('repeat'),notes:v('notes'),doneDates:prev?.doneDates||[]});}if(kind==='workout'){Object.assign(obj,{date:v('date'),group:v('group'),minutes:Number(v('minutes')),exercises:v('exercises'),notes:v('notes')});}if(kind==='study'){Object.assign(obj,{date:v('date'),subject:v('subject'),minutes:Number(v('minutes')),notes:v('notes')});}if(kind==='goal'){Object.assign(obj,{title:v('title'),metric:v('metric'),target:Number(v('target')),current:v('metric')==='manual'?Number(v('current')||0):0,unit:v('unit'),due:v('due')});if(obj.target<=0){toast('목표 수치는 0보다 커야 해요.');return;}}if(prev){a[a.indexOf(prev)]=obj;}else a.push(obj);}save();closeModal();render();toast('저장했어요.');}
  function updateMonth(n){const d=dateObj(calMonth);d.setDate(1);d.setMonth(d.getMonth()+n);calMonth=localISO(d);selectedDate=calMonth;render();}
  function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  function exportData(){download(`my-space-backup-${today()}.json`,JSON.stringify(data,null,2),'application/json;charset=utf-8');toast('백업 파일을 다운로드했어요.');}
  async function importData(file){if(!file)return;try{const txt=await file.text();if(txt.length>5e6)throw new Error('너무 큰 파일입니다.');const imported=normalize(JSON.parse(txt));if(!confirm('현재 기록을 백업 파일 내용으로 교체할까요?'))return;data=imported;save();view='dashboard';render();toast('백업 데이터 복원이 완료됐어요.');}catch(e){alert('백업 파일을 읽지 못했어요: '+e.message);}const input=document.getElementById('importFile');if(input)input.value='';}
  function navTo(v){view=v;render();window.scrollTo(0,0);}
  document.addEventListener('click',e=>{if(e.target.id==='overlay'){closeModal();return;}const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,identifier=b.dataset.id;switch(action){case 'navigate':navTo(b.dataset.view);break;case 'theme':data.theme=data.theme==='light'?'dark':'light';save();render();break;case 'select-date':selectedDate=b.dataset.date;calMonth=selectedDate.slice(0,7)+'-01';navTo('calendar');break;case 'month-prev':updateMonth(-1);break;case 'month-next':updateMonth(1);break;case 'calendar-today':selectedDate=today();calMonth=selectedDate.slice(0,7)+'-01';render();break;case 'close-modal':closeModal();break;case 'add-event':openModal('event');break;case 'add-study-event':openModal('event',null,{category:'공부'});break;case 'add-workout':openModal('workout');break;case 'add-study':openModal('study');break;case 'add-goal':openModal('goal');break;case 'edit-routine':openModal('routine',null,{day:Number(b.dataset.day)});break;case 'edit-event':openModal('event',data.events.find(x=>x.id===identifier));break;case 'edit-workout':openModal('workout',data.workouts.find(x=>x.id===identifier));break;case 'edit-study':openModal('study',data.studies.find(x=>x.id===identifier));break;case 'edit-goal':openModal('goal',data.goals.find(x=>x.id===identifier));break;case 'toggle-event':{const record=data.events.find(x=>x.id===identifier);if(record){const day=b.dataset.date;record.doneDates=record.doneDates||[];if(record.doneDates.includes(day))record.doneDates=record.doneDates.filter(x=>x!==day);else record.doneDates.push(day);save();render();}break;}case 'increment-goal':{const g=data.goals.find(x=>x.id===identifier);if(g&&g.metric==='manual'){g.current=Math.min(Number(g.target),Number(g.current||0)+1);save();render();}break;}case 'delete-event':case 'delete-workout':case 'delete-study':case 'delete-goal':{const arr={ 'delete-event':'events','delete-workout':'workouts','delete-study':'studies','delete-goal':'goals'}[action];if(confirm('이 항목을 삭제할까요?')){data[arr]=data[arr].filter(x=>x.id!==identifier);save();render();toast('삭제했어요.');}break;}case 'clear-demo':if(confirm('예시 기록과 목표를 모두 지우고 빈 화면에서 시작할까요?')){const theme=data.theme;data=emptyState();data.theme=theme;save();render();toast('빈 공간으로 시작합니다.');}break;case 'reset':if(confirm('모든 기록을 삭제할까요? 이 작업은 되돌릴 수 없습니다.')){const theme=data.theme;data=emptyState();data.theme=theme;save();view='dashboard';render();toast('모든 기록을 초기화했습니다.');}break;case 'export':exportData();break;case 'import':document.getElementById('importFile')?.click();break;}});
  document.addEventListener('submit',e=>{if(e.target.id!=='entityForm')return;e.preventDefault();if(!e.target.reportValidity())return;newRecord(e.target);});
  document.addEventListener('change',e=>{if(e.target.id==='importFile')importData(e.target.files?.[0]);});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
  render();
})();
</script>
</body>
