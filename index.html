<script>
(()=>{'use strict';
const KEY='my-space-rebuild-v3';const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const icon=(x,cls='')=>`<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${x}"></use></svg>`;const uid=()=>crypto?.randomUUID?.()||('id'+Date.now()+Math.random().toString(36).slice(2));const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const today=()=>iso(new Date());const date=d=>new Date(d+'T12:00:00');const shift=(s,n)=>{let d=date(s);d.setDate(d.getDate()+n);return iso(d)};const mon=s=>shift(s,-((date(s).getDay()+6)%7));const weekdays=['월','화','수','목','금','토','일'];const wd=s=>(date(s).getDay()+6)%7;const fmt=n=>Number(n||0).toLocaleString('ko-KR');const money=n=>fmt(n)+'원';const month=s=>s.slice(0,7);const nice=s=>date(s).toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const fresh=()=>({v:3,theme:'light',courses:[],lectures:[],notes:[],exams:[],routine:weekdays.map((_,i)=>({day:i,muscles:i===0?['가슴']:i===1?['등']:i===3?['어깨']:i===4?['하체']:[]})),workouts:[],weight:0,proteinFactor:1.6,protein:[],events:[],assets:[],expenses:[]});
function normalize(x){if(!x||typeof x!=='object')throw Error('잘못된 백업 형식');let r=fresh();for(const k of ['courses','lectures','notes','exams','routine','workouts','protein','events','assets','expenses']){if(!Array.isArray(x[k]))throw Error('백업 항목 누락: '+k);r[k]=x[k]};r.theme=x.theme==='dark'?'dark':'light';r.weight=Number(x.weight)||0;r.proteinFactor=Number(x.proteinFactor)||1.6;return r}
let data;try{data=normalize(JSON.parse(localStorage.getItem(KEY)))}catch{data=fresh()};let view='home',tab='courses',calDate=today(),calMonth=month(today())+'-01',selectedCourse='all',finMonth=month(today()),toastT;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{notice('저장에 실패했어요. 백업 기능을 이용해 주세요.')}}function notice(s){let t=$('#toast');t.textContent=s;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}function commit(msg='저장했어요'){persist();render();notice(msg)}const find=(t,id)=>data[t].find(a=>a.id===id);const remove=(t,id)=>{if(!confirm('이 항목을 삭제할까요?'))return;data[t]=data[t].filter(a=>a.id!==id);if(t==='courses'){for(const k of ['lectures','notes','exams'])data[k]=data[k].filter(a=>a.course!==id)}commit('삭제했어요')};const courseName=id=>find('courses',id)?.name||'과목 없음';const week=()=>Array.from({length:7},(_,i)=>shift(mon(today()),i));const workoutThisWeek=()=>data.workouts.filter(a=>a.date>=week()[0]&&a.date<=week()[6]);const studyProgress=()=>data.lectures.length?Math.round(data.lectures.filter(x=>x.done).length/data.lectures.length*100):0;const assetsSum=()=>data.assets.filter(x=>x.category!=='대출').reduce((a,x)=>a+Number(x.amount||0),0);const debts=()=>data.assets.filter(x=>x.category==='대출').reduce((a,x)=>a+Number(x.amount||0),0);const expSum=(m,type)=>data.expenses.filter(x=>month(x.date)===m&&(!type||x.type===type)).reduce((a,x)=>a+Number(x.amount||0),0);const proteinToday=()=>data.protein.filter(x=>x.date===today()).reduce((a,x)=>a+Number(x.grams||0),0);const proteinTarget=()=>Math.round(data.weight*data.proteinFactor);
const items=[['home','home','홈'],['study','study','공부'],['workout','workout','운동'],['calendar','calendar','일정'],['finance','finance','자산']];
function menu(){return items.map(([k,i,t])=>`<button class="nav-btn ${view===k?'active':''}" data-act="nav" data-view="${k}">${icon(i)} ${t} 관리</button>`).join('')}
function render(){document.documentElement.dataset.theme=data.theme;const label={home:'통합 대시보드',study:'학업·노트 관리',workout:'운동·영양 관리',calendar:'일정 캘린더',finance:'자산·가계부',settings:'설정 및 백업'}[view];$('#root').innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="logo">M</div><div><strong>MY SPACE</strong><span>PERSONAL WORKSPACE</span></div></div><div class="nav-title">WORKSPACE</div><nav>${menu()}</nav><div class="nav-title" style="margin-top:25px">SETTING</div><nav><button class="nav-btn ${view==='settings'?'active':''}" data-act="nav" data-view="settings">${icon('settings')} 설정 및 백업</button></nav><div class="side-bottom">● 기기별 브라우저에 자동 저장<br>MY SPACE v3.0</div></aside><div class="main"><header class="topbar"><div><div class="crumb">MY SPACE / ${label}</div><div class="location">${label}</div></div><div class="top-right"><span class="date muted small">${new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'})}</span><button class="btn icon-only" data-act="theme" aria-label="화면 모드">${icon(data.theme==='dark'?'sun':'moon')}</button><button class="btn icon-only" data-act="nav" data-view="settings" aria-label="설정">${icon('settings')}</button></div></header><main class="page">${({home:homeView,study:studyView,workout:workoutView,calendar:calendarView,finance:financeView,settings:settingsView})[view]()}</main></div><nav class="bottom-nav">${items.map(([k,i,t])=>`<button data-act="nav" data-view="${k}" class="${view===k?'active':''}">${icon(i)}<span>${t}</span></button>`).join('')}</nav></div>`}
function empty(t='아직 기록이 없어요',s='오른쪽 위의 추가 버튼을 눌러 시작해 보세요.') {return `<div class="blank"><b>${t}</b>${s}</div>`}
function line(title,sub,actions=''){return `<div class="item"><div class="grow"><div class="name">${esc(title)}</div><div class="sub">${esc(sub)}</div></div>${actions}</div>`}
function actions(type,id){return `<div class="actions"><button class="btn sm" data-act="edit" data-type="${type}" data-id="${esc(id)}" aria-label="수정">${icon('edit')}</button><button class="btn sm danger" data-act="delete" data-type="${type}" data-id="${esc(id)}" aria-label="삭제">${icon('trash')}</button></div>`}
function stat(name,value,foot,i){return `<div class="panel"><div class="iconBox">${icon(i)}</div><div class="stat-label">${name}</div><div class="stat-val num">${value}</div><div class="tiny muted">${foot}</div></div>`}
function homeView(){let ex=[...data.exams].filter(x=>x.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);let ev=[...data.events].filter(x=>x.date>=today()).sort((a,b)=>a.date.localeCompare(b.date));let upcoming=[...ex.map(x=>({name:x.title,when:x.date,kind:'시험'})),...ev.map(x=>({name:x.title,when:x.date,kind:'일정'}))].sort((a,b)=>a.when.localeCompare(b.when)).slice(0,5);let net=assetsSum()-debts();return `<div class="hero"><div><div class="tiny" style="color:#bdcdfa;font-weight:800">${nice(today())} · MY DAILY SPACE</div><h1>하루의 기록을 한곳에,<br>목표는 더 선명하게.</h1><p>공부 · 운동 · 일정 · 자산을 한 화면에서 확인하세요.</p><button class="btn" data-act="nav" data-view="calendar">${icon('plus')} 일정 추가하러 가기</button></div><div class="hero-icon">✦</div></div><div class="grid4 stats">${stat('강의 완료',`${data.lectures.filter(x=>x.done).length}/${data.lectures.length}`,'등록된 강의 기준','study')}${stat('이번 주 운동',`${workoutThisWeek().length}회`,'기록한 운동 횟수','workout')}${stat('예정된 시험',`${ex.length}개`,'가장 가까운 시험 3개 기준','calendar')}${stat('현재 순자산',money(net),'등록된 자산 − 대출','finance')}</div><div class="grid2" style="margin-top:16px"><section class="panel"><div class="between"><h2 style="margin:0">다가오는 일정·시험</h2><button class="btn sm soft" data-act="nav" data-view="calendar">달력 보기 ${icon('chevron')}</button></div><div class="items">${upcoming.length?upcoming.map(x=>line(x.name,`${nice(x.when)} · ${x.kind}`)).join(''):empty('다가오는 일정이 없어요','일정 또는 시험 날짜를 등록해 보세요.')}</div></section><section class="panel"><div class="between"><h2 style="margin:0">이번 주 운동 체크</h2><button class="btn sm soft" data-act="nav" data-view="workout">운동 관리 ${icon('chevron')}</button></div><div class="row wrap" style="margin-top:18px">${week().map(d=>`<div style="flex:1;min-width:32px;text-align:center"><div class="tiny muted">${weekdays[wd(d)]}</div><div style="margin:9px auto;width:31px;height:31px;border-radius:10px;display:grid;place-items:center;background:${data.workouts.some(x=>x.date===d)?'var(--brandSoft)':'var(--paper2)'};color:var(--brand)">${data.workouts.some(x=>x.date===d)?icon('check'):date(d).getDate()}</div></div>`).join('')}</div><div class="info" style="margin-top:16px">운동 기록을 남기면 자동으로 주간 현황에 반영돼요.</div></section></div><div class="grid2" style="margin-top:16px"><section class="panel"><div class="between"><h2 style="margin:0">학습 진행률</h2><span class="progress-number">${studyProgress()}%</span></div><div class="bar" style="margin-top:15px"><span style="width:${studyProgress()}%"></span></div><p class="small muted" style="margin:13px 0 0">완료 강의 ${data.lectures.filter(x=>x.done).length}개 · 전체 강의 ${data.lectures.length}개</p></section><section class="panel"><div class="between"><h2 style="margin:0">오늘 단백질 섭취량</h2><span class="progress-number">${fmt(proteinToday())}g ${proteinTarget()?'/ '+proteinTarget()+'g':''}</span></div><div class="bar" style="margin-top:15px"><span style="width:${proteinTarget()?clamp(proteinToday()/proteinTarget()*100,0,100):0}%"></span></div><p class="small muted" style="margin:13px 0 0">운동 메뉴에서 체중과 식사 기록을 설정할 수 있어요.</p></section></div>`}
function tabs(values){return `<div class="tabs">${values.map(([k,t])=>`<button class="tab ${tab===k?'active':''}" data-act="tab" data-tab="${k}">${t}</button>`).join('')}</div>`}
function studyView(){const courses=data.courses;let select=`<select id="courseFilter"><option value="all">전체 과목</option>${courses.map(x=>`<option value="${esc(x.id)}" ${selectedCourse===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`;const allowed=x=>selectedCourse==='all'||x.course===selectedCourse;return `<div class="between wrap"><div><h1>공부 관리</h1><p class="muted small">한양사이버대학교 강의, 시험, 필기 노트를 한곳에서 관리하세요.</p></div><button class="btn primary" data-act="add" data-type="courses">${icon('plus')} 과목 등록</button></div><div class="grid4 stats">${stat('등록 과목',`${courses.length}개`,'학기별 과목을 등록해 보세요','study')}${stat('강의 수강률',`${studyProgress()}%`,'완료 체크 자동 집계','check')}${stat('예정 시험',`${data.exams.filter(x=>x.date>=today()).length}개`,'등록한 시험·과제','calendar')}${stat('필기 노트',`${data.notes.length}개`,'과목별 중요 내용','edit')}</div>${tabs([['courses','과목 관리'],['lectures','강의 일정'],['exams','시험·과제'],['notes','중요 노트']])}${tab==='courses'?`<div class="grid2"><section class="panel"><div class="between"><h2 style="margin:0">나의 과목</h2><button class="btn sm soft" data-act="add" data-type="courses">+ 과목</button></div>${courses.length?courses.map(x=>{let ls=data.lectures.filter(a=>a.course===x.id);return `<div class="course-pill" style="margin-top:11px"><div><div class="name">${esc(x.name)}</div><div class="tiny muted">${esc(x.term||'학기 미설정')} · ${ls.filter(a=>a.done).length}/${ls.length} 강의 완료</div></div>${actions('courses',x.id)}</div>`}).join(''):empty('등록된 과목이 없어요','과목을 등록한 뒤 강의를 추가해 보세요.')}</section><section class="panel"><h2>과목별 수강률</h2>${courses.length?courses.map(x=>{let ls=data.lectures.filter(a=>a.course===x.id),pct=ls.length?Math.round(ls.filter(a=>a.done).length/ls.length*100):0;return `<div class="progress-row"><div class="between"><b class="small">${esc(x.name)}</b><span class="tiny muted">${pct}%</span></div><div class="bar" style="margin-top:8px"><span style="width:${pct}%"></span></div></div>`}).join(''):empty()}</section></div>`:`<div class="panel"><div class="between wrap" style="margin-bottom:14px"><div style="min-width:180px;flex:1;max-width:300px">${select}</div><button class="btn primary" data-act="add" data-type="${tab}">${icon('plus')} ${tab==='lectures'?'강의':tab==='exams'?'시험·과제':'노트'} 추가</button></div>${tab==='lectures'?`<div class="items">${data.lectures.filter(allowed).sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<div class="item ${x.done?'done':''}"><input aria-label="강의 수강 완료" type="checkbox" data-act="lecture-check" data-id="${esc(x.id)}" ${x.done?'checked':''}><div class="grow"><div class="name">${esc(x.title)}</div><div class="sub">${esc(courseName(x.course))} · ${nice(x.date)} ${x.time? '· '+esc(x.time):''}</div></div>${actions('lectures',x.id)}</div>`).join('')||empty('강의가 없어요','강의명·수강일을 등록하고 수강 완료를 체크해 보세요.')}</div>`:tab==='exams'?`<div class="items">${data.exams.filter(allowed).sort((a,b)=>a.date.localeCompare(b.date)).map(x=>line(x.title,`${courseName(x.course)} · ${nice(x.date)} ${x.time||''} · ${x.kind||'시험'}`,actions('exams',x.id))).join('')||empty('시험·과제가 없어요','시험 날짜와 과제 마감일을 등록해 보세요.')}</div>`:`<div class="stack">${data.notes.filter(allowed).map(x=>`<div class="note-card"><div class="between"><div><b>${esc(x.title)}</b><div class="tiny muted">${esc(courseName(x.course))}</div></div>${actions('notes',x.id)}</div><div class="note-text small" style="margin-top:12px">${esc(x.content)}</div></div>`).join('')||empty('노트가 없어요','핵심 공식·강의 내용·시험 대비 메모를 정리해 보세요.')}</div>`}</div>`}`}
function workoutView(){let w=data.weight,pt=proteinTarget(),got=proteinToday();return `<div class="between wrap"><div><h1>운동 · 영양 관리</h1><p class="muted small">요일별 운동 부위 체크, 운동 기록, 단백질 섭취량을 관리하세요.</p></div><button class="btn primary" data-act="add" data-type="workouts">${icon('plus')} 운동 기록</button></div><div class="grid4 stats">${stat('이번 주 운동',`${workoutThisWeek().length}회`,'운동 날짜별 기록','workout')}${stat('현재 몸무게',w?`${w}kg`:'미등록','목표 섭취량 계산 기준','target')}${stat('단백질 목표',pt?`${pt}g`:'설정 필요',`${data.proteinFactor}g × 체중(kg)`,'check')}${stat('오늘 섭취',`${fmt(got)}g`,pt?`목표 달성률 ${Math.round(got/pt*100)}%`:'체중을 입력해 주세요','study')}</div><div class="grid2" style="margin-top:17px"><section class="panel"><div class="between wrap"><h2 style="margin:0">월~일 운동 부위</h2><span class="tiny muted">체크하면 운동 기록에 저장</span></div><div class="week-grid" style="margin-top:17px">${week().map((d,i)=>`<div class="week-day ${d===today()?'today':''}"><div class="between"><b>${weekdays[i]}요일</b><span class="tiny muted">${d.slice(-2)}일</span></div>${['가슴','등','어깨','하체','팔','유산소'].map(m=>`<label class="check-label"><input type="checkbox" data-act="muscle" data-date="${d}" data-muscle="${m}" ${data.workouts.some(x=>x.date===d&&x.muscle===m)?'checked':''}>${m}</label>`).join('')}</div>`).join('')}</div><div class="info" style="margin-top:14px">체크한 부위는 해당 날짜의 운동 기록으로 남고, 다시 체크 해제하면 삭제됩니다. 횟수·중량 기록은 아래에서 따로 추가할 수 있어요.</div></section><section class="stack"><div class="panel"><div class="between"><h2 style="margin:0">체중·단백질 기준 설정</h2><button class="btn sm" data-act="weight-edit">수정</button></div><div class="between" style="margin-top:16px"><div><div class="tiny muted">현재 체중</div><div class="pillStat">${w||'—'} <span class="small muted">kg</span></div></div><div><div class="tiny muted">단백질 목표</div><div class="pillStat">${pt||'—'} <span class="small muted">g/일</span></div></div></div><div class="bar" style="margin-top:16px"><span style="width:${pt?clamp(got/pt*100,0,100):0}%"></span></div><div class="tiny muted" style="margin-top:9px">목표값은 조절 가능하며 의료적 개인 권장량을 의미하지 않습니다.</div></div><div class="panel"><div class="between"><h2 style="margin:0">오늘 단백질 기록</h2><button class="btn sm soft" data-act="add" data-type="protein">+ 섭취 추가</button></div><div class="items">${data.protein.filter(x=>x.date===today()).map(x=>line(x.food,`${x.grams}g · ${nice(x.date)}`,actions('protein',x.id))).join('')||empty('오늘 기록이 없어요','식사별 단백질 섭취량을 등록해 보세요.')}</div></div></section></div><section class="panel" style="margin-top:17px"><div class="between"><h2 style="margin:0">최근 운동 기록</h2><button class="btn sm soft" data-act="add" data-type="workouts">+ 추가</button></div><div class="items">${[...data.workouts].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30).map(x=>line(`${x.muscle} ${x.detail?'· '+x.detail:''}`,`${nice(x.date)}${x.memo?' · '+x.memo:''}`,actions('workouts',x.id))).join('')||empty('아직 운동 기록이 없어요','요일별 체크박스를 눌러 첫 기록을 남겨 보세요.')}</div></section>`}
function allCalEvents(d){return [...data.events.filter(x=>x.date===d).map(x=>({...x,kind:'event'})),...data.lectures.filter(x=>x.date===d).map(x=>({...x,kind:'lecture'})),...data.exams.filter(x=>x.date===d).map(x=>({...x,kind:'exam'}))].sort((a,b)=>(a.time||'').localeCompare(b.time||''))}
function calendarView(){let first=date(calMonth),offset=wd(calMonth),start=shift(calMonth,-offset),cells=Array.from({length:42},(_,i)=>shift(start,i)),dayEvents=allCalEvents(calDate);return `<div class="between wrap"><div><h1>일정 관리</h1><p class="small muted">개인 일정과 강의·시험 날짜를 하나의 캘린더에서 확인하세요.</p></div><button class="btn primary" data-act="add" data-type="events">${icon('plus')} 일정 등록</button></div><div class="calendar-layout" style="margin-top:18px"><section class="panel"><div class="between wrap" style="margin-bottom:12px"><h2 style="margin:0">${first.getFullYear()}년 ${first.getMonth()+1}월</h2><div class="row"><button class="btn sm" data-act="cal-today">오늘</button><button class="btn sm" data-act="cal-prev">◀</button><button class="btn sm" data-act="cal-next">▶</button></div></div><div class="calendar">${weekdays.map(x=>`<div class="weekday">${x}</div>`).join('')}${cells.map(d=>`<button class="day ${month(d)===month(calMonth)?'':'other'} ${d===today()?'today':''} ${d===calDate?'selected':''}" data-act="cal-select" data-date="${d}"><span class="dnum">${date(d).getDate()}</span>${allCalEvents(d).slice(0,2).map(x=>`<span class="event-mark ${x.kind}">${esc(x.title)}</span>`).join('')}${allCalEvents(d).length>2?`<span class="tiny muted">+${allCalEvents(d).length-2}</span>`:''}</button>`).join('')}</div></section><section class="panel"><div class="between"><h2 style="margin:0">${nice(calDate)}</h2><button class="btn sm soft" data-act="add" data-type="events">+ 일정</button></div><div class="items" style="margin-top:12px">${dayEvents.map(x=>line(x.title,`${x.kind==='exam'?'시험·과제':x.kind==='lecture'?'강의':'개인 일정'} ${x.time?'· '+x.time:''}${x.kind==='event'&&x.memo?' · '+x.memo:''}`,actions(x.kind==='exam'?'exams':x.kind==='lecture'?'lectures':'events',x.id))).join('')||empty('이 날짜에 일정이 없어요','일정을 추가하거나 다른 날짜를 눌러봐요.')}</div><div class="info" style="margin-top:15px">공부 메뉴에서 등록한 강의 및 시험 날짜도 자동 표시됩니다.</div></section></div>`}
function financeView(){let a=assetsSum(),d=debts(),net=a-d,ex=expSum(finMonth),fixed=expSum(finMonth,'고정비'),variable=expSum(finMonth,'변동비'),cats=['투자','저축','현금','기타'];return `<div class="between wrap"><div><h1>자산 · 지출 관리</h1><p class="small muted">보유 자산, 대출, 월별 고정비·변동비를 한눈에 확인하세요.</p></div><div class="row"><button class="btn" data-act="add" data-type="assets">+ 자산</button><button class="btn primary" data-act="add" data-type="expenses">+ 지출</button></div></div><div class="grid4 stats">${stat('총 보유 자산',money(a),'대출 제외','finance')}${stat('대출 잔액',money(d),'부채로 별도 집계','target')}${stat('순자산',money(net),'보유 자산 − 대출','check')}${stat('이번 달 지출',money(expSum(month(today()))),'현재 월 기준','calendar')}</div><div class="grid2" style="margin-top:17px"><section class="panel"><div class="between"><h2 style="margin:0">자산 구성</h2><button class="btn sm soft" data-act="add" data-type="assets">+ 등록</button></div><div class="finance-bars" style="margin-top:16px">${[...cats,'대출'].map(c=>{let v=data.assets.filter(x=>x.category===c).reduce((s,x)=>s+Number(x.amount||0),0),pct=a&&c!=='대출'?Math.round(v/a*100):d&&c==='대출'?100:0;return `<div class="fbar"><div><b>${c}</b><span class="num">${money(v)}</span></div><div class="bar"><span style="width:${pct}%;background:${c==='대출'?'var(--red)':'var(--brand)'}"></span></div></div>`}).join('')}</div><div class="items" style="margin-top:17px">${data.assets.map(x=>line(`${x.name} · ${x.category}`,money(x.amount),actions('assets',x.id))).join('')||empty('자산을 등록해 보세요','투자·저축·현금·대출을 각각 등록할 수 있어요.')}</div></section><section class="panel"><div class="between wrap"><h2 style="margin:0">월별 지출 현황</h2><input aria-label="조회 월" type="month" id="finMonth" value="${finMonth}" style="width:160px"></div><div class="grid2" style="margin-top:15px;gap:10px"><div style="background:var(--paper2);padding:13px;border-radius:12px"><div class="tiny muted">고정비</div><div class="kpi">${money(fixed)}</div></div><div style="background:var(--paper2);padding:13px;border-radius:12px"><div class="tiny muted">변동비</div><div class="kpi">${money(variable)}</div></div></div><div class="between" style="margin-top:17px"><b>총 지출</b><span class="kpi">${money(ex)}</span></div><div class="bar" style="margin-top:12px"><span style="width:${ex?Math.round(fixed/ex*100):0}%"></span></div><div class="tiny muted" style="margin-top:8px">색상 막대: 전체 지출 중 고정비 비중</div><div class="items" style="margin-top:15px">${data.expenses.filter(x=>month(x.date)===finMonth).sort((x,y)=>y.date.localeCompare(x.date)).map(x=>line(`${x.name} · ${x.type}`,`${nice(x.date)} · ${money(x.amount)}`,actions('expenses',x.id))).join('')||empty('이달 지출 내역이 없어요','지출을 추가하면 고정비·변동비를 자동 집계해요.')}</div></section></div><div class="info" style="margin-top:16px">현재 버전은 은행·증권사 자동 연동 없이 직접 등록하는 방식입니다. 자산의 실시간 시세 갱신이나 다른 기기와의 동기화는 지원하지 않습니다.</div>`}
function settingsView(){return `<div><h1>설정 및 데이터 관리</h1><p class="small muted">테마 변경, 백업·복원, 기록 초기화를 관리할 수 있어요.</p></div><div class="grid2" style="margin-top:18px"><section class="panel"><h2>사이트 설정</h2><div class="between"><div><b>화면 모드</b><div class="tiny muted">라이트 / 다크</div></div><button class="btn" data-act="theme">${data.theme==='dark'?'라이트 모드':'다크 모드'}</button></div><div class="info" style="margin-top:20px">이 사이트는 개인 브라우저의 로컬 저장소를 사용합니다. 기록을 안전하게 유지하려면 주기적으로 백업하세요.</div></section><section class="panel"><h2>데이터 백업</h2><div class="stack"><button class="btn" data-act="export">${icon('download')} 전체 데이터 JSON 내보내기</button><button class="btn" data-act="import">백업 파일 불러오기</button><input id="importInput" type="file" accept=".json,application/json" style="display:none"><button class="btn danger" data-act="reset">전체 기록 초기화</button></div></section></div><div class="info" style="margin-top:16px"><b>개인정보 안내</b><br>GitHub Pages 사이트는 공개 주소입니다. 현재는 로그인 기능이 없으며 브라우저에 데이터가 저장됩니다. 금융 계좌번호, 비밀번호, 주민등록번호 같은 민감한 정보는 입력하지 마세요. 브라우저별로 기록이 따로 저장됩니다.</div>`}
const C={courses:[['name','과목명','text',true],['term','학기 (예: 2026-2학기)','text'],['professor','교수명 (선택)','text']],lectures:[['course','과목','course',true],['title','강의명 / 주차','text',true],['date','수강 예정일','date',true],['time','수업 시간 (선택)','time'],['memo','강의 메모','textarea']],exams:[['course','과목','course',true],['title','시험명 / 과제명','text',true],['kind','구분','select:시험|과제|퀴즈|기타'],['date','날짜 / 제출기한','date',true],['time','시간','time'],['memo','메모','textarea']],notes:[['course','과목','course',true],['title','노트 제목','text',true],['content','중요 필기 내용','textarea',true]],workouts:[['date','운동 날짜','date',true],['muscle','운동 부위','select:가슴|등|어깨|하체|팔|유산소|전신|기타',true],['detail','종목·세트·횟수','text'],['memo','메모','textarea']],protein:[['date','섭취 날짜','date',true],['food','음식 / 식사 구분','text',true],['grams','단백질량(g)','number',true]],events:[['title','일정 제목','text',true],['date','날짜','date',true],['time','시간','time'],['memo','메모','textarea']],assets:[['name','자산 이름 (예: 주택청약)','text',true],['category','분류','select:투자|저축|현금|대출|기타',true],['amount','현재 잔액(원)','number',true]],expenses:[['name','지출 항목 (예: 통신비)','text',true],['type','지출 유형','select:고정비|변동비',true],['date','지출일','date',true],['amount','금액(원)','number',true]]};
function fieldHtml([key,label,type,required],obj){let v=obj?.[key]??((key==='date')?today():(key==='kind')?'시험':(key==='category')?'저축':(key==='type')?'고정비':'');let req=required?'required':'';return `<label class="field">${label}${type==='course'?`<select name="${key}" ${req}><option value="">과목 선택</option>${data.courses.map(x=>`<option value="${esc(x.id)}" ${v===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${key}" ${req}>${esc(v)}</textarea>`:type.startsWith('select:')?`<select name="${key}" ${req}>${type.slice(7).split('|').map(x=>`<option value="${esc(x)}" ${v===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`:`<input name="${key}" type="${type}" ${type==='number'?'min="0" step="any"':''} value="${esc(v)}" ${req}>`}</label>`}
function openForm(type,id){let obj=id?find(type,id):null;if(type!=='courses'&&['lectures','exams','notes'].includes(type)&&!data.courses.length){notice('먼저 과목을 등록해 주세요');tab='courses';view='study';render();return}let title={courses:'과목',lectures:'강의',exams:'시험·과제',notes:'필기 노트',workouts:'운동',protein:'단백질',events:'일정',assets:'자산',expenses:'지출'}[type];$('#modalRoot').innerHTML=`<div class="modalBack"><div class="modal"><div class="between"><div><h2>${title} ${obj?'수정':'추가'}</h2><p class="tiny muted">입력한 정보는 이 기기에 저장됩니다.</p></div><button class="btn icon-only" data-act="close">✕</button></div><form id="editForm" data-type="${type}" data-id="${esc(id||'')}"><div class="fields" style="margin-top:18px">${C[type].map(x=>fieldHtml(x,obj)).join('')}</div><div class="modalFoot"><button type="button" class="btn" data-act="close">취소</button><button class="btn primary" type="submit">저장하기</button></div></form></div></div>`;$('#modalRoot input:not([type=hidden]),#modalRoot textarea')?.focus()}
function weightForm(){ $('#modalRoot').innerHTML=`<div class="modalBack"><div class="modal"><div class="between"><h2>체중·단백질 목표</h2><button class="btn icon-only" data-act="close">✕</button></div><form id="weightForm"><div class="fields" style="margin-top:18px"><label class="field">현재 체중 (kg)<input type="number" min="0" max="500" step="0.1" name="weight" required value="${data.weight||''}"></label><label class="field">체중 1kg당 하루 단백질 목표 (g)<input type="number" min="0.5" max="3" step="0.1" name="factor" value="${data.proteinFactor}"></label><div class="info">기본값 1.6g/kg은 일반적인 근력운동용 예시입니다. 개인 건강 상태에 따라 적정량이 달라질 수 있습니다.</div></div><div class="modalFoot"><button type="button" class="btn" data-act="close">취소</button><button class="btn primary">저장하기</button></div></form></div></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id,type=b.dataset.type;if(a==='nav'){view=b.dataset.view;window.scrollTo(0,0);render()}else if(a==='theme'){data.theme=data.theme==='dark'?'light':'dark';commit('화면 모드를 변경했어요')}else if(a==='tab'){tab=b.dataset.tab;render()}else if(a==='add'){openForm(type)}else if(a==='edit'){openForm(type,id)}else if(a==='delete'){remove(type,id)}else if(a==='close'){closeModal()}else if(a==='lecture-check'){let x=find('lectures',id);if(x){x.done=b.checked??!x.done;commit(x.done?'강의 완료!':'완료를 취소했어요')}}else if(a==='muscle'){let date=b.dataset.date,muscle=b.dataset.muscle;let prev=data.workouts.find(x=>x.date===date&&x.muscle===muscle&&!x.detail&&!x.memo);if(b.checked){if(!data.workouts.some(x=>x.date===date&&x.muscle===muscle))data.workouts.push({id:uid(),date,muscle,detail:'',memo:''})}else{if(prev)data.workouts=data.workouts.filter(x=>x.id!==prev.id);else{let matches=data.workouts.filter(x=>x.date===date&&x.muscle===muscle);if(matches.length){if(confirm('해당 부위의 운동 기록을 모두 삭제할까요?'))data.workouts=data.workouts.filter(x=>!(x.date===date&&x.muscle===muscle));else{render();return}}}}commit('운동 체크가 반영됐어요')}else if(a==='weight-edit'){weightForm()}else if(a==='cal-prev'||a==='cal-next'){let d=date(calMonth);d.setMonth(d.getMonth()+(a==='cal-next'?1:-1));calMonth=iso(d);render()}else if(a==='cal-today'){calMonth=month(today())+'-01';calDate=today();render()}else if(a==='cal-select'){calDate=b.dataset.date;calMonth=month(calDate)+'-01';render()}else if(a==='export'){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`MY_SPACE_backup_${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000);notice('백업 파일을 저장했어요')}else if(a==='import'){$('#importInput')?.click()}else if(a==='reset'){if(confirm('모든 기록을 초기화할까요? 되돌릴 수 없습니다. 백업을 권장합니다.')&&confirm('정말 전체 삭제할까요?')){data=fresh();selectedCourse='all';commit('전체 기록을 초기화했어요')}}});
document.addEventListener('change',async e=>{if(e.target.id==='courseFilter'){selectedCourse=e.target.value;render()}else if(e.target.id==='finMonth'){finMonth=e.target.value;render()}else if(e.target.id==='importInput'){let file=e.target.files?.[0];if(!file)return;try{const tmp=normalize(JSON.parse(await file.text()));if(confirm('현재 데이터를 백업 파일로 교체할까요?')){data=tmp;commit('백업 파일을 복원했어요')}}catch(err){notice('백업 파일 형식을 확인해 주세요')}}});
document.addEventListener('submit',e=>{if(e.target.id==='editForm'){e.preventDefault();let f=e.target,type=f.dataset.type,id=f.dataset.id;const obj=id?find(type,id):{id:uid()};if(!obj)return;for(const [key,,kind] of C[type]){let x=f.elements.namedItem(key)?.value??'';obj[key]=kind==='number'?Number(x):x}if(type==='lectures'&&!id)obj.done=false;if(!id)data[type].push(obj);closeModal();commit('저장했어요')}else if(e.target.id==='weightForm'){e.preventDefault();let w=Number(e.target.elements.namedItem('weight').value),fac=Number(e.target.elements.namedItem('factor').value);if(!(w>0&&fac>=.5&&fac<=3))return notice('체중과 목표를 다시 확인해 주세요');data.weight=w;data.proteinFactor=fac;closeModal();commit('단백질 목표를 업데이트했어요')}});
render();
})();
</script></body></html>
